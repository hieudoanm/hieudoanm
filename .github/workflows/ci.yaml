name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  cli-quality:
    name: CLI - Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --all-targets

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout page sources
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: page

      # page/ is a self-contained site: index.html, styles.css, images/.
      # "images/..." paths resolve at the site root on Pages and relative
      # to page/ over file://.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: page

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
