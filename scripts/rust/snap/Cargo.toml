[package]
name = "snap"
version = "0.1.0"
edition = "2021"
description = "Capture website screenshots with Firefox via WebDriver (no Chromium/Chrome)"
license = "MIT"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive", "env"] }
env_logger = "=0.11.11"
futures = "=0.3.34"
log = "=0.4.35"
serde_json = "=1.0.154"
thirtyfour = "=0.38.3"
tokio = { version = "=1.54.1", features = ["full"] }

[dev-dependencies]

[profile.release]
opt-level = 2
lto = true
