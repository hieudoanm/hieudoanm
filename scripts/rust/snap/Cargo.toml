[package]
name = "snap"
version = "0.1.0"
edition = "2021"
description = "Capture website screenshots with Firefox via WebDriver (no Chromium/Chrome)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
futures = "0.3"
log = "0.4"
serde_json = "1"
thirtyfour = "0.38"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]

[profile.release]
opt-level = 2
lto = true
