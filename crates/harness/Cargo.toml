[package]
name = "harness"
version = "0.1.0"
edition = "2021"
description = "Minimal agent harness: MCP tool client + LLM chat loop"
license = "MIT"

[[bin]]
name = "hieudoanm"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["full"] }
reqwest = { version = "=0.12.28", features = ["json", "rustls-tls", "stream"], default-features = false }
futures = "=0.3.34"
ratatui = "=0.30.2"
crossterm = "=0.29.0"
rustyline = "=19.0.0"
