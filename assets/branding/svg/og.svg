<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#191919" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFAF8"/>
      <stop offset="1" stop-color="#F0EFEC"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Header -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#191919">
    <text x="76" y="75" font-size="17" font-weight="700" letter-spacing="3">HIEU DOAN</text>
    <text x="1204" y="75" text-anchor="end" font-size="12" letter-spacing="2" fill="#777">
      N.E.D (NEUROSCIENCE · ENGINEERING · DESIGN)
    </text>
  </g>
  <path d="M76 100H1204" stroke="#191919" stroke-opacity=".18"/>

  <!-- Logo on the left -->
  <g transform="translate(75 105) scale(1.12)">
    <path
      d="
        M 165.5 270
        L 165.5 312
        C 165.5 330.2 153.2 344 136 344
        C 118 344 105 330.2 105 312
        L 105 116
        C 105 97.8 118 84 136 84
        C 154 84 166 97.8 166 116
        L 166 157
        C 166 194 175 210 202 210
        C 229 210 250 210 250 256
        L 250 312
        C 250 330.2 262.8 344 280 344
        C 298 344 311 330.2 311 312
        L 311 116
        C 311 97.8 298 84 280 84
        C 262 84 250 97.8 250 116
        L 250 157
      "
      fill="none"
      stroke="#191919"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Subtle logo caption -->
  <text x="285" y="535" text-anchor="middle"
        font-family="monospace" font-size="11"
        letter-spacing="3" fill="#999">H · D</text>

  <!-- Main introduction -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#191919">
    <text x="490" y="190" font-size="16" letter-spacing="3" fill="#777">
      HELLO, I'M
    </text>
    <text x="484" y="280" font-size="76" font-weight="700" letter-spacing="-4">
      Hieu Doan.
    </text>

    <text x="490" y="350" font-size="23" fill="#555">
      Software engineer by background,
    </text>
    <text x="490" y="386" font-size="23" fill="#555">
      curious about how the world works.
    </text>
    <text x="490" y="422" font-size="23" fill="#555">
      Building tools, exploring data,
    </text>
    <text x="490" y="458" font-size="23" fill="#555">
      and finding beauty in design.
    </text>
  </g>

  <!-- Footer -->
  <path d="M76 570H1204" stroke="#191919" stroke-opacity=".18"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#777" letter-spacing="1.5">
    <text x="76" y="598">BUILDING THINGS · EXPLORING IDEAS</text>
    <text x="1204" y="598" text-anchor="end">CURIOUS BY NATURE.</text>
  </g>
</svg>