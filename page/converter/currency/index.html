<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Currency Converter</title>
    <meta
      name="description"
      content="Convert between world currencies with live rates, base VND." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Currency Converter</h1>
        <p class="sub">
          Live rates via open.er-api.com, base VND — works offline with a
          snapshot fallback.
        </p>
      </div>
    </header>
    <main class="wrap">
      <div class="card">
        <label class="field">
          <span class="label">Amount</span>
          <input
            id="amount"
            type="number"
            min="0"
            step="any"
            value="1000000"
            placeholder="1,000,000" />
        </label>

        <label class="field">
          <span class="label">From</span>
          <select id="from"></select>
        </label>

        <button id="swap" type="button" class="swap">⇅ Swap</button>

        <label class="field">
          <span class="label">To</span>
          <select id="to"></select>
        </label>

        <div id="result" class="result"></div>
      </div>

      <section class="quick">
        <h2 id="quick-title"></h2>
        <div id="quick-list" class="rows"></div>
      </section>

      <p id="source" class="source"></p>
    </main>
    <script src="scripts.js"></script>
  </body>
</html>
